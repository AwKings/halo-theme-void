apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-void-nav
spec:
  displayName: VOID Nav
  author:
    name: AwKings
  description: >-
    基于 VOID（无类型）主题的导航页专用主题，沿用 VOID 的排版与配色，提供分组卡片、
    实时搜索与键盘快捷键。信息架构参考 van-nav（https://github.com/Mereithhh/van-nav）。
    VOID 原主题为 Typecho 主题 Typecho-Theme-VOID（原作者：熊猫小A，https://blog.imalan.cn）。
  logo: ""
  homepage: https://github.com/AwKings/halo-theme-void/tree/void_nav
  repo: https://github.com/AwKings/halo-theme-void
  issues: https://github.com/AwKings/halo-theme-void/issues
  settingName: "theme-void-nav-setting"
  configMapName: "theme-void-nav-configmap"
  version: 1.1.26
  requires: ">=2.20.0"
  license:
    - name: "MIT"
      url: "https://github.com/AwKings/halo-theme-void/blob/void_nav/LICENSE"
