<th:block th:fragment="header">
<header
  th:class="|header-mode-${theme.config.advanced?.header_mode ?: '1'} force-dark no-banner|"
>
  <div class="container wider">
    <nav class="nav-minimal">
      <a
        role="button"
        aria-label="展开分类"
        class="toggle nav-mobile-only"
        target="_self"
        href="javascript:void(0);"
        onclick="VOID_Ui.toggleNav(this);"
      >
        <span></span>
      </a>

      <a class="brand" th:href="@{/}" th:text="${theme.config.basic?.brand_name ?: site.title}">VOID</a>

      <a
        role="button"
        aria-label="搜索"
        id="nav-toggle-search"
        class="nav-head-btn nav-mobile-only"
        target="_self"
        href="javascript:void(0);"
      >
        <i class="voidicon-search"></i>
      </a>

      <a
        role="button"
        aria-label="设置"
        id="nav-toggle-setting"
        class="nav-head-btn nav-mobile-only"
        target="_self"
        href="javascript:void(0);"
        onclick="VOID_Ui.toggleSettingPanel();"
      >
        <i class="voidicon-cog"></i>
      </a>
    </nav>
  </div>
</header>

<div id="nav-mobile" class="nav-mobile-drawer">
  <section id="nav-categories" data-title="分类">
    <nav>
      <a class="nav-mobile-cat active" data-group="all" href="javascript:void(0);">全部</a>
      <a
        class="nav-mobile-cat"
        href="javascript:void(0);"
        th:each="g, gs : ${theme.config.nav != null ? theme.config.nav.groups : null}"
        th:attr="data-group=${gs.index}"
        th:text="${g.name}"
      ></a>
    </nav>
  </section>
</div>
</th:block>
