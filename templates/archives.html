<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{partials/layout :: html(title = |归档 - ${site.title}|, head = null, content = ~{::content})}"
>
  <th:block th:fragment="content">
    <th:block th:with="banner=${theme.config.basic?.default_banner ?: ''}">
      <main id="pjax-container">
        <div
          th:class="${'lazy-wrap' + (#strings.isEmpty(banner) ? ' no-banner' : ' loading dark')}"
        >
          <div id="banner" th:if="${!#strings.isEmpty(banner)}">
            <img
              th:if="${(theme.config.advanced?.browser_level_lazyload ?: false)}"
              class="lazyload browserlevel-lazy"
              th:src="${banner}"
              loading="lazy"
              alt=""
            />
            <img
              th:if="${!(theme.config.advanced?.browser_level_lazyload ?: false)}"
              class="lazyload"
              th:attr="data-src=${banner}"
              alt=""
            />
          </div>
          <script th:if="${!#strings.isEmpty(banner)}">
            $('body>header').removeClass('force-dark').removeClass('no-banner');
          </script>
          <script th:if="${#strings.isEmpty(banner)}">
            $('body>header').addClass('force-dark').addClass('no-banner');
          </script>

          <div class="banner-title">
            <h1 class="post-title">归档</h1>
            <p class="post-meta">
              <span
                th:with="stats=${siteStatsFinder.getStats()}"
                th:text="|${stats.category} 分类 × ${stats.post} 文章 × ${#lists.size(tagFinder.listAll().?[postCount > 0])} 标签 × ${#aggregates.sum(postFinder.listAll().![#conversions.convert(#annotations.getOrDefault(#this, 'void_words', '0'), 'java.lang.Integer')])} 字|"
              ></span>
            </p>
          </div>
        </div>

        <div class="wrapper container narrow">
          <div class="tag-cloud archive-tag-cloud yue float-up">
            <h2>Tags</h2>
            <a
              th:each="tag : ${tagFinder.listAll()}"
              th:if="${tag.postCount > 0}"
              rel="tag"
              class="tag-item"
              th:href="@{${tag.status.permalink}}"
              th:title="|${tag.postCount} 个话题|"
              th:text="${tag.spec.displayName}"
            ></a>
            <p th:if="${#lists.isEmpty(tagFinder.listAll())}">还没有标签哦～</p>
          </div>
          <section id="archive-list" class="yue float-up">
            <th:block th:each="archive, iter : ${archives.items}">
              <th:block th:with="count=${#aggregates.sum(archive.months.![#lists.size(posts)])}">
                <h2>
                  <span class="archive-year-title" th:text="${archive.year}"></span>
                  <span class="num-posts" th:text="|${count} 篇|"></span>
                  <a
                    no-pjax
                    target="_self"
                    th:attr="data-num=${count},data-year=${archive.year}"
                    class="toggle-archive"
                    href="javascript:void(0);"
                    th:text="${iter.index > 0} ? '+' : '-'"
                    onclick="VOID_Ui.toggleArchive(this); return false;"
                  ></a>
                </h2>
                <section
                  th:id="|year-${archive.year}|"
                  th:class="${'year' + (iter.index > 0 ? ' shrink' : '')}"
                  th:style="|max-height: ${iter.index > 0 ? 0 : count * 49}px; transition-duration: ${count * 0.03 > 0.8 ? 0.8 : count * 0.03}s|"
                >
                <ul>
                  <th:block th:each="month : ${archive.months}">
                    <li th:each="post : ${month.posts}">
                      <a
                        class="archive-title show-word-count"
                        th:attr="data-words=${#annotations.getOrDefault(post, 'void_words', '0')}"
                        th:href="@{${post.status.permalink}}"
                      >
                        <span
                          class="date"
                          th:text="${#temporals.format(post.spec.publishTime, 'MM-dd')}"
                        ></span><span th:text="${post.spec.title}"></span>
                      </a>
                      <span
                        class="archive-categories"
                        th:if="${post.spec.categories != null and !#lists.isEmpty(post.spec.categories)}"
                      >
                        <th:block th:each="cat : ${categoryFinder.listAll()}">
                          <a
                            th:if="${post.spec.categories.contains(cat.metadata.name)}"
                            class="archive-category-tag"
                            th:href="@{${cat.status.permalink}}"
                            th:text="${cat.spec.displayName}"
                          ></a>
                        </th:block>
                      </span>
                    </li>
                  </th:block>
                </ul>
                </section>
              </th:block>
            </th:block>
            <p th:if="${archives.total == 0}">还没有文章哦～</p>
          </section>

          <th:block
            th:replace="~{partials/pagination :: pager(context = ${site.routes.archivesUri + '/'}, prevUrl = ${archives.prevUrl}, nextUrl = ${archives.nextUrl}, totalPages = ${archives.totalPages}, page = ${archives.page}, hasPrevious = ${archives.hasPrevious()}, hasNext = ${archives.hasNext()})}"
          />
        </div>
      </main>
    </th:block>
  </th:block>
</html>
