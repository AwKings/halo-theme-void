<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{partials/layout :: html(title = ${singlePage.spec.title + ' - ' + site.title}, head = null, content = ~{::content})}"
>
  <th:block th:fragment="content">
    <th:block
      th:with="
        banner=${#annotations.getOrDefault(singlePage, 'void_banner', singlePage.spec.cover ?: '')},
        archiveList=${postFinder.archives(1, 500)}
      "
    >
      <main id="pjax-container">
        <div
          th:class="${'lazy-wrap' + (#strings.isEmpty(banner) ? ' no-banner' : ' loading dark')}"
        >
          <div id="banner" th:if="${!#strings.isEmpty(banner)}">
            <img class="lazyload" th:attr="data-src=${banner}" alt="" />
          </div>
          <script th:if="${!#strings.isEmpty(banner)}">
            $('body>header').removeClass('force-dark').removeClass('no-banner');
          </script>
          <script th:if="${#strings.isEmpty(banner)}">
            $('body>header').addClass('force-dark').addClass('no-banner');
          </script>
          <div class="banner-title">
            <h1 class="post-title" th:text="${singlePage.spec.title}"></h1>
            <p class="post-meta">
              <span
                th:with="stats=${siteStatsFinder.getStats()}"
                th:text="|${stats.category} 分类 × ${stats.post} 文章 × ${#lists.size(tagFinder.listAll().?[postCount > 0])} 标签 × ${#aggregates.sum(postFinder.listAll().![#conversions.convert(#annotations.getOrDefault(#this, 'void_words', '0'), 'java.lang.Integer')])} 字|"
              ></span>
            </p>
          </div>
        </div>

        <div class="wrapper container narrow">
          <div class="tag-cloud archive-tag-cloud yue float-up">
            <h2>Tags</h2>
            <th:block th:with="allTags=${tagFinder.listAll()}">
              <a
                th:each="tag : ${allTags}"
                rel="tag"
                class="tag-item"
                th:href="@{${tag.status.permalink}}"
                th:title="|${tag.postCount} 个话题|"
                th:text="${tag.spec.displayName}"
              ></a>
              <p th:if="${#lists.isEmpty(allTags)}">还没有标签哦～</p>
            </th:block>
          </div>

          <section id="archive-list" class="yue float-up">
            <th:block th:each="archive : ${archiveList.items}">
              <h2>
                <span class="archive-year-title" th:text="${archive.year}"></span>
                <span class="num-posts" th:text="|${#aggregates.sum(archive.months.![#lists.size(posts)])} 篇|"></span>
              </h2>
              <section th:id="|year-${archive.year}|" class="year">
                <ul>
                  <th:block th:each="month : ${archive.months}">
                    <li th:each="post : ${month.posts}">
                      <a
                        class="archive-title show-word-count"
                        th:attr="data-words=${#annotations.getOrDefault(post, 'void_words', '0')}"
                        th:href="@{${post.status.permalink}}"
                      >
                        <span
                          class="date"
                          th:text="${#temporals.format(post.spec.publishTime, 'MM-dd')}"
                        ></span><span th:text="${post.spec.title}"></span>
                      </a>
                      <span
                        class="archive-categories"
                        th:if="${post.spec.categories != null and !#lists.isEmpty(post.spec.categories)}"
                      >
                        <th:block th:each="cat : ${categoryFinder.listAll()}">
                          <a
                            th:if="${post.spec.categories.contains(cat.metadata.name)}"
                            class="archive-category-tag"
                            th:href="@{${cat.status.permalink}}"
                            th:text="${cat.spec.displayName}"
                          ></a>
                        </th:block>
                      </span>
                    </li>
                  </th:block>
                </ul>
              </section>
            </th:block>
          </section>
        </div>
      </main>
    </th:block>
  </th:block>
</html>
