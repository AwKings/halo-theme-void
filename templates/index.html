<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{partials/layout :: html(title = ${site.title}, head = null, content = ~{::content})}"
>
  <th:block th:fragment="content">
    <main id="pjax-container">
      <div class="wrapper container wide nav-wrapper">
        <div
          class="nav-search"
          th:if="${theme.config.nav == null or theme.config.nav.show_search == null or theme.config.nav.show_search}"
        >
          <svg class="nav-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M10 2a8 8 0 1 0 4.9 14.32l5.39 5.39 1.42-1.42-5.39-5.39A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"
            />
          </svg>
          <input
            id="nav-search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            th:placeholder="${theme.config.nav != null and theme.config.nav.search_placeholder != null and !#strings.isEmpty(theme.config.nav.search_placeholder) ? theme.config.nav.search_placeholder : '搜索站点，回车打开第一个结果'}"
          />
        </div>

        <nav class="nav-tabs" id="nav-tabs">
          <a
            th:each="g, gs : ${theme.config.nav != null ? theme.config.nav.groups : null}"
            class="nav-tab"
            th:href="|#nav-group-${gs.index}|"
            th:attr="data-group=${gs.index}"
            th:text="${g.name}"
          ></a>
        </nav>

        <th:block th:if="${theme.config.nav != null and theme.config.nav.groups != null}">
          <section
            class="nav-group"
            th:each="g, gs : ${theme.config.nav.groups}"
            th:id="|nav-group-${gs.index}|"
            th:attr="data-group=${gs.index}"
          >
            <h2 class="nav-group-title">
              <span th:text="${g.name}"></span>
              <small th:if="${g.desc != null and !#strings.isEmpty(g.desc)}" th:text="${g.desc}"></small>
            </h2>

            <div class="nav-grid" th:attr="data-columns=${theme.config.nav.columns ?: '4'}">
              <a
                class="nav-card"
                th:each="s, ss : ${g.sites}"
                th:href="${s.url}"
                target="_blank"
                rel="noopener"
                th:attr="data-name=${s.name},data-desc=${s.desc},data-url=${s.url}"
              >
                <span class="nav-logo">
                  <img
                    th:if="${s.logo != null and !#strings.isEmpty(s.logo)}"
                    th:src="${s.logo}"
                    alt=""
                    loading="lazy"
                  />
                  <span
                    th:unless="${s.logo != null and !#strings.isEmpty(s.logo)}"
                    th:text="${#strings.isEmpty(s.name) ? '?' : #strings.substring(s.name, 0, 1)}"
                  ></span>
                </span>
                <span class="nav-meta">
                  <span class="nav-name" th:text="${s.name}"></span>
                  <span
                    class="nav-desc"
                    th:if="${s.desc != null and !#strings.isEmpty(s.desc)}"
                    th:text="${s.desc}"
                  ></span>
                </span>
                <span
                  class="nav-badge"
                  th:if="${s.badge != null and !#strings.isEmpty(s.badge)}"
                  th:text="${s.badge}"
                ></span>
                <span
                  class="nav-num"
                  th:if="${theme.config.nav == null or theme.config.nav.show_shortcut_number == null or theme.config.nav.show_shortcut_number}"
                  th:text="${ss.count}"
                ></span>
              </a>
            </div>

            <p class="nav-group-empty" th:if="${g.sites == null or #lists.isEmpty(g.sites)}">
              这个分组还没有站点
            </p>
          </section>
        </th:block>

        <div class="nav-no-result" id="nav-no-result" style="display: none">
          <p>没有找到匹配的站点</p>
        </div>

        <th:block th:if="${theme.config.nav == null or theme.config.nav.groups == null}">
          <div class="nav-no-result">
            <p>还没有配置导航数据</p>
            <p class="nav-hint">前往后台 → 外观 → 主题 → 导航页，添加分组和站点</p>
          </div>
        </th:block>
      </div>

      <script th:src="@{/assets/js/void-nav.js?v={v}(v=${theme.spec.version})}"></script>
    </main>
  </th:block>
</html>
