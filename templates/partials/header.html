<th:block th:fragment="header">
<header
  th:class="|header-mode-${theme.config.advanced?.header_mode ?: '1'} force-dark no-banner|"
>
  <div class="container wider">
    <nav>
      <a
        role="button"
        aria-label="展开导航"
        class="toggle"
        target="_self"
        href="javascript:void(0);"
        onclick="VOID_Ui.toggleNav(this);"
      >
        <span></span>
      </a>
      <a class="brand" th:href="@{/}" th:text="${theme.config.basic?.brand_name ?: site.title}">VOID</a>

      <th:block th:with="menu=${menuFinder.getPrimary()}">
        <th:block th:if="${menu != null}">
          <th:block th:each="item : ${menu.menuItems}">
            <th:block
              th:with="isCatMenu=${(theme.config.advanced?.category_dropdown ?: true) and item.spec.href != null and #strings.startsWith(item.spec.href, '/categories')}"
            >
              <!-- 一级菜单指向分类页：悬浮展开全部分类 -->
              <span class="dropdown" th:if="${isCatMenu}">
                <span class="dropdown-label" th:text="${item.status.displayName}"></span>
                <ul>
                  <li th:each="cat : ${categoryFinder.listAll()}">
                    <a th:href="@{${cat.status.permalink}}" th:text="${cat.spec.displayName}"></a>
                  </li>
                </ul>
              </span>
              <span
                class="dropdown"
                th:if="${!isCatMenu and item.children != null and !#lists.isEmpty(item.children)}"
              >
                <span class="dropdown-label" th:text="${item.status.displayName}"></span>
                <ul>
                  <li th:each="child : ${item.children}">
                    <a
                      th:href="@{${child.status.href}}"
                      th:text="${child.status.displayName}"
                      th:target="${child.spec.target?.value}"
                    ></a>
                  </li>
                </ul>
              </span>
              <a
                th:if="${!isCatMenu and (item.children == null or #lists.isEmpty(item.children))}"
                th:href="@{${item.status.href}}"
                th:text="${item.status.displayName}"
                th:target="${item.spec.target?.value}"
              ></a>
            </th:block>
          </th:block>
        </th:block>
      </th:block>

      <th:block th:with="moreLinks=${theme.config.advanced?.more_menu}">
        <span class="dropdown" th:if="${moreLinks != null and !#lists.isEmpty(moreLinks)}">
          <span class="dropdown-label">更多</span>
          <ul>
            <li th:each="link : ${moreLinks}">
              <a
                th:href="${link.href}"
                th:text="${link.name}"
                th:target="${link.target ?: '_blank'}"
                th:attr="rel=${(link.target ?: '_blank') == '_blank' ? 'noopener' : null}"
              ></a>
            </li>
          </ul>
        </span>
      </th:block>

      <a
        role="button"
        aria-label="展开搜索"
        class="search-form-input"
        style="display: flex"
        id="toggle-mobile-search"
        target="_self"
        href="javascript:void(0);"
        onclick="VOID_Ui.toggleSearch(this);"
      >
        <i class="voidicon-search"></i>
      </a>
      <a
        target="_self"
        href="javascript:void(0);"
        id="toggle-setting"
        onclick="VOID_Ui.toggleSettingPanel();"
      >
        <i class="voidicon-cog"></i>
      </a>
    </nav>
  </div>
  <div class="mobile-search-form">
    <form class="search-bar" onsubmit="VOID.startSearch('#search_new'); return false;">
      <i class="voidicon-search"></i>
      <input
        onkeydown="VOID.enterSearch(event, this);"
        type="text"
        name="search-content"
        id="search_new"
        required
        placeholder="搜索文章标题或摘要…"
      />
      <button type="submit">搜索</button>
    </form>
  </div>
</header>

<div id="nav-mobile">
  <!-- 一级菜单是链接：直接平铺 -->
  <section id="pages" data-title="页面">
    <nav>
      <th:block th:with="menu=${menuFinder.getPrimary()}">
        <th:block th:if="${menu != null}">
          <a
            th:each="item : ${menu.menuItems}"
            th:if="${(item.children == null or #lists.isEmpty(item.children)) and !((theme.config.advanced?.category_dropdown ?: true) and item.spec.href != null and #strings.startsWith(item.spec.href, '/categories'))}"
            th:href="@{${item.status.href}}"
            th:text="${item.status.displayName}"
            th:target="${item.spec.target?.value}"
          ></a>
        </th:block>
      </th:block>
    </nav>
  </section>

  <!-- 指向分类页的一级菜单：手机端作为分组标题，列出全部分类 -->
  <section
    th:each="item : ${menuFinder.getPrimary()?.menuItems}"
    th:if="${(theme.config.advanced?.category_dropdown ?: true) and item.spec.href != null and #strings.startsWith(item.spec.href, '/categories')}"
    th:attr="data-title=${item.status.displayName}"
    class="nav-mobile-group"
  >
    <nav>
      <a
        th:each="cat : ${categoryFinder.listAll()}"
        th:href="@{${cat.status.permalink}}"
        th:text="${cat.spec.displayName}"
      ></a>
    </nav>
  </section>

  <!-- 一级菜单带子项：一级作标题，子项列在标题下方 -->
  <section
    th:each="item : ${menuFinder.getPrimary()?.menuItems}"
    th:if="${item.children != null and !#lists.isEmpty(item.children) and !((theme.config.advanced?.category_dropdown ?: true) and item.spec.href != null and #strings.startsWith(item.spec.href, '/categories'))}"
    th:attr="data-title=${item.status.displayName}"
    class="nav-mobile-group"
  >
    <nav>
      <a
        th:each="child : ${item.children}"
        th:href="@{${child.status.href}}"
        th:text="${child.status.displayName}"
        th:target="${child.spec.target?.value}"
      ></a>
    </nav>
  </section>
</div>
</th:block>
