<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{partials/layout :: html(title = ${post.spec.title + ' - ' + site.title}, head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <th:block th:if="${(theme.config.seo?.enable_metadata ?: false)}">
      <link rel="canonical" th:href="@{${site.url + post.status.permalink}}" />
      <meta property="og:type" content="article" />
      <meta property="og:title" th:content="${post.spec.title}" />
      <meta property="og:url" th:content="${site.url + post.status.permalink}" />
    </th:block>
  </th:block>

  <th:block th:fragment="content">
    <th:block
      th:with="banner=${#annotations.getOrDefault(post, 'void_banner', post.spec.cover ?: '')}"
    >
      <main id="pjax-container" class="main-excerpt">
        <script>
          document.querySelector('body>header').classList.remove('force-dark');
        </script>
        <style>
          body > footer {
            display: none;
          }
          main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 17.5vh 0 50px 0;
          }
        </style>
        <div class="app-landscape theme-dark">
          <div class="mask" id="bg"><div class="mask"></div></div>
          <div class="container" style="margin-bottom: 2rem">
            <article class="yue">
              <h1 class="post-title" th:text="${post.spec.title}" style="color: #fff"></h1>
              <div class="articleBody" th:utext="${post.content.content}"></div>
            </article>
          </div>
          <script th:inline="javascript">
            (function () {
              var applyBg = function (url) {
                var bg = document.getElementById('bg');
                bg.style.backgroundImage = 'url(' + url + ')';
                bg.classList.add('loaded');
              };
              var img_bg = new Image();
              var img_bg_url = /*[[${banner}]]*/ '';
              if (!img_bg.complete) {
                img_bg.onload = function () {
                  applyBg(img_bg_url);
                };
                img_bg.src = img_bg_url;
              } else {
                img_bg.src = img_bg_url;
                applyBg(img_bg_url);
              }
            })();
          </script>
        </div>
        <div class="theme-dark" style="width: 100%">
          <div class="comments-container float-up">
            <section id="comments" class="container">
              <th:block th:if="${haloCommentEnabled}">
                <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}" />
              </th:block>
            </section>
          </div>
        </div>
      </main>
    </th:block>
  </th:block>
</html>
