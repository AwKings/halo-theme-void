<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{partials/layout :: html(title = '瞬間 - ' + ${site.title}, head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <th:block th:if="${(theme.config.seo?.enable_metadata ?: false)}">
      <link rel="canonical" th:href="@{/voidtimes}" />
      <meta property="og:type" content="website" />
      <meta property="og:title" content="瞬間" />
      <meta property="og:site_name" th:content="${site.title}" />
      <meta property="og:url" th:content="${site.url + '/voidtimes'}" />
    </th:block>
    <script
      th:src="@{/assets/js/void-times.js?v={v}(v=${theme.spec.version})}"
      defer
    ></script>
  </th:block>

  <th:block th:fragment="content">
    <main id="pjax-container">
      <div class="lazy-wrap no-banner">
        <script>
          $('body>header').addClass('force-dark').addClass('no-banner');
        </script>

        <div class="wrapper container">
          <div class="contents-wrap">
            <section id="post" class="float-up">
              <div class="void-times">
                <article
                  class="void-time"
                  th:each="item : ${times}"
                  th:attr="data-name=${item.name}"
                >
                  <div class="void-time__meta">
                    <time
                      class="void-time__date"
                      th:datetime="${item.publishedAt}"
                      th:text="${#temporals.format(item.publishedAt, 'M月d日')}"
                      >11月3日</time
                    >
                    <time
                      class="void-time__clock"
                      th:text="${#temporals.format(item.publishedAt, 'HH:mm')}"
                      >20:00</time
                    >
                  </div>

                  <div class="void-time__body">
                    <div class="articleBody full" th:utext="${item.content}"></div>

                    <div
                      class="void-time__images"
                      th:if="${item.images != null and !#lists.isEmpty(item.images)}"
                    >
                      <a
                        th:each="image : ${item.images}"
                        class="void-time__image"
                        th:href="${image}"
                        target="_blank"
                        rel="noopener"
                      >
                        <img th:src="${image}" alt="" loading="lazy" />
                      </a>
                    </div>

                    <div class="void-time__actions">
                      <a
                        role="button"
                        aria-label="点赞"
                        href="javascript:void(0);"
                        class="btn btn-normal post-like vote-button void-like"
                        th:classappend="${item.liked} ? ' done' : ''"
                        th:attr="data-name=${item.name}"
                        >ENJOY
                        <span class="value" th:text="${item.likes}">0</span></a
                      >
                    </div>
                  </div>
                </article>

                <p class="void-times__empty" th:if="${#lists.isEmpty(times)}">
                  还没有任何瞬間。
                </p>
              </div>

              <ul class="pager" th:if="${totalPages > 1}">
                <li th:if="${hasPrev}">
                  <a th:href="@{${prevUrl}}" rel="prev">上一页</a>
                </li>
                <li class="current"><span th:text="${page}">1</span></li>
                <li th:if="${hasNext}">
                  <a th:href="@{${nextUrl}}" rel="next">下一页</a>
                </li>
              </ul>
            </section>
          </div>
        </div>
      </div>
    </main>
  </th:block>
</html>
