apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-void-nav-setting
spec:
  forms:
    - group: nav
      label: 导航页
      formSchema:
        - $formkit: switch
          name: show_search
          label: 显示搜索框
          value: true
        - $formkit: text
          name: search_placeholder
          label: 搜索框提示文字
          value: "搜索站点，回车打开第一个结果"
        - $formkit: select
          name: columns
          label: 每行卡片数（宽屏）
          value: "4"
          options:
            - label: 3 列
              value: "3"
            - label: 4 列
              value: "4"
            - label: 5 列
              value: "5"
        - $formkit: switch
          name: show_shortcut_number
          label: 悬停显示快捷数字
          value: true
          help: "显示后可用 Ctrl / ⌘ + 数字直接打开对应站点。"
        - $formkit: array
          name: groups
          label: 分组
          value: []
          itemLabels:
            - type: "text"
              label: "$value.name"
          children:
            - $formkit: text
              name: name
              label: 分组名称
              validation: "required"
            - $formkit: text
              name: desc
              label: 分组描述（显示在标题右侧）
            - $formkit: array
              name: sites
              label: 站点
              value: []
              itemLabels:
                - type: "text"
                  label: "$value.name"
                - type: "text"
                  label: "$value.url"
              children:
                - $formkit: text
                  name: name
                  label: 名称
                  validation: "required"
                - $formkit: text
                  name: url
                  label: 链接
                  validation: "required"
                - $formkit: text
                  name: desc
                  label: 描述
                - $formkit: attachment
                  name: logo
                  label: 图标
                - $formkit: text
                  name: badge
                  label: 角标文字
                  help: "例如「新」「内网」，留空则不显示。"

    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: brand_name
          label: 左上角站点名
          value: ""
          help: "留空则使用站点标题。"
        - $formkit: radio
          name: color_scheme
          label: 主题颜色模式
          value: "0"
          options:
            - label: 自动切换
              value: "0"
            - label: 日间模式
              value: "1"
            - label: 夜间模式
              value: "2"
          help: "自动模式下每天 22:00 到次日 06:59 显示为夜间模式。"
        - $formkit: text
          name: footer_text
          label: 页脚补充内容
          value: ""
          help: "例如备案号，支持 HTML。"

    - group: content
      label: 内容与排版
      formSchema:
        - $formkit: checkbox
          name: serif_in_content
          label: 正文使用衬线体
          value: false
          help: "使用思源宋体（Google Fonts 提供）。"
        - $formkit: checkbox
          name: lazyload
          label: 图片懒加载
          value: true
        - $formkit: select
          name: default_font_size
          label: 默认字号
          value: "3"
          options:
            - label: 14px
              value: "1"
            - label: 16px
              value: "2"
            - label: 18px
              value: "3"
            - label: 20px
              value: "4"
            - label: 22px
              value: "5"

    - group: advanced
      label: 高级设置
      formSchema:
        - $formkit: radio
          name: header_mode
          label: 导航栏模式
          value: "1"
          options:
            - label: 随滚动显隐
              value: "0"
            - label: 固定
              value: "1"
            - label: 不固定
              value: "2"
        - $formkit: checkbox
          name: follow_system_color_scheme
          label: 跟随系统深色模式
          value: false
        - $formkit: number
          name: dark_mode_start
          label: 夜间模式开始时间
          value: 22
          min: 0
          max: 24
          step: 0.5
        - $formkit: number
          name: dark_mode_end
          label: 夜间模式结束时间
          value: 7
          min: 0
          max: 24
          step: 0.5
        - $formkit: text
          name: brand_font_src
          label: 品牌字体地址
          value: ""
          help: "用于站点标题的自定义字体文件（ttf/woff/woff2）。"
        - $formkit: select
          name: brand_font_style
          label: 品牌字体样式
          value: normal
          options:
            - label: normal
              value: normal
            - label: italic
              value: italic
        - $formkit: select
          name: brand_font_weight
          label: 品牌字体字重
          value: normal
          options:
            - label: normal
              value: normal
            - label: bold
              value: bold
            - label: "300"
              value: "300"
            - label: "400"
              value: "400"
            - label: "700"
              value: "700"
        - $formkit: text
          name: service_worker
          label: 自定义 Service Worker
          value: ""
          help: "文件名，需自行放置于站点根目录，例如 VOIDCacheRule.js。"
        - $formkit: repeater
          name: social_links
          label: 设置面板里的社交链接
          value: []
          max: 10
          children:
            - $formkit: text
              name: name
              label: 名称
              value: ""
            - $formkit: text
              name: icon
              label: 图标
              value: "link"
              help: "voidicon 图标名，例如 github、weibo、twitter、qq、link。"
            - $formkit: text
              name: href
              label: 链接
              value: ""
            - $formkit: text
              name: target
              label: 打开方式
              value: "_blank"
